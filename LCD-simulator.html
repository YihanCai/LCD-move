<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCD 山峰动画模拟器 · 透明推屏 (240x240)</title>
<style>
  :root {
    --bg: #1e2430; --panel: #2a3140; --panel2: #333c4f;
    --text: #e6ebf2; --muted: #9aa7bd; --accent: #4da3ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 24px;
  }
  .wrap { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  .screen { background: #111; border-radius: 18px; padding: 22px; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  canvas {
    width: 360px; height: 360px; image-rendering: pixelated;
    display: block; background: #000; border-radius: 10px;
  }
  .badge { margin-top: 10px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .panel {
    background: var(--panel); border-radius: 18px; padding: 20px 22px;
    width: 300px; box-shadow: 0 12px 40px rgba(0,0,0,.4);
  }
  .panel h1 { font-size: 17px; margin-bottom: 4px; }
  .panel .sub { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .group { margin-bottom: 16px; }
  .group .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  button {
    flex: 1; padding: 8px 10px; border: none; border-radius: 8px;
    background: var(--panel2); color: var(--text); cursor: pointer; font-size: 13px; transition: background .15s;
  }
  button:hover { background: #3d4760; }
  button.active { background: var(--accent); color: #0b1a2b; font-weight: 600; }
  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .toggles button { font-size: 12px; }
  .readout {
    margin-top: 8px; background: var(--panel2); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; font-family: "Consolas", monospace; color: var(--muted);
  }
  .readout b { color: var(--accent); }
  .hint { font-size: 11px; color: var(--muted); line-height: 1.6; margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <!-- ============ 屏幕 ============ -->
  <div class="screen">
    <canvas id="lcd" width="240" height="240"></canvas>
    <div class="badge"><span>ST7789 · 240×240 · 动画区 y160~240</span><span id="frameStat">—</span></div>
  </div>

  <!-- ============ 控制面板 ============ -->
  <div class="panel">
    <h1>山峰动画模拟器（步骤 B）</h1>
    <div class="sub">局部画布 + 透明推屏 · 山体以下透出宿主背景</div>

    <div class="group">
      <div class="label"><span>移动速度</span><span id="spdVal">中</span></div>
      <input type="range" id="speed" min="1" max="100" value="30">
    </div>

    <div class="group">
      <div class="label"><span>人物位置 x</span><span id="xVal">—</span></div>
      <input type="range" id="personX" min="20" max="205" value="100" step="1">
      <div class="row">
        <button id="btnPlay" class="active">▶ 播放</button>
        <button id="btnPause">⏸ 暂停</button>
      </div>
    </div>

    <div class="group">
      <div class="label">显示元素</div>
      <div class="toggles">
        <button id="tgHost" class="active">宿主区</button>
        <button id="tgMountain" class="active">山体</button>
        <button id="tgRock" class="active">岩层</button>
        <button id="tgSnow" class="active">雪帽</button>
        <button id="tgCrack" class="active">裂缝</button>
        <button id="tgPerson" class="active">小人</button>
        <button id="tgRidge" class="active">山脊线</button>
      </div>
    </div>

    <div class="readout" id="readout">
      person.x = <b id="roX">100</b><br>
      左脚坡高(局部) = <b id="roGL">—</b>　右脚坡高(局部) = <b id="roGR">—</b>
    </div>

    <div class="hint">
      💡 步骤 B：透明色按键推屏 —— 动画画布中"透明打底色（黑）"的像素跳过不写入，
      因此山体/小人之外能透出下方宿主背景；上方 2/3 宿主内容完全不受影响。
      试试关闭"宿主区"开关对比效果。
    </div>
  </div>
</div>

<script>
// ============================================================
// 步骤 A：局部画布 —— 动画只占屏幕下方 1/3（y 160~240）
// 主画布 240x240 = 整块屏幕；anim 离屏 240x80 = LovyanGFX Sprite
// 所有动画坐标均为【局部坐标】（相当于屏幕 y 减去 160）
// ============================================================
const W = 240, SCR_H = 240;
const ANIM_Y = 160, ANIM_H = 80;      // 动画区：从 y=160 开始，高 80
const TRANSP = '#000000';             // 透明打底色（黑）

const ctx = document.getElementById('lcd').getContext('2d');       // 整屏
const anim = document.createElement('canvas');                    // 离屏动画画布（模拟 Sprite）
anim.width = W; anim.height = ANIM_H;
const actx = anim.getContext('2d');

// ---------- 山脊折线（局部坐标：山脚 = 画布底 y=80，山顶平台 y=38）----------
// 屏幕坐标 = 局部坐标 + 160（例如平台 (202,198) → 局部 (202,38)）
const RIDGE = [
  [  0,  80],   // 山脚（左下角）
  [ 45,  73],
  [ 90,  65],
  [130,  58],
  [150,  60],   // 小凹（真实山脊有起伏）
  [175,  48],
  [190,  40],
  [202,  38],   // 进入山顶（左侧）
  [215,  38],   // ← 山顶平坦段（水平台地）
  [225,  48],   // 右侧下坡
  [240,  80],   // 山体右缘（用于闭合，不作为爬坡路径）
];

// ---------- 颜色（C_TRANSP 为透明打底色，动画画面内不出现）----------
const C = {
  mountain:  '#2B6B3C',  // 山体主色（深岩绿）
  rock:      ['#357A46','#3D854F','#47905A','#519B65','#5CA870','#68B57C'], // 岩层（逐层变浅→受光）
  snow:      '#F2F7F4',  // 雪帽
  crack:     '#1E4A2E',  // 岩石裂缝
  ridge:     '#FFFFFF',  // 山脊受光棱线
  person:    '#E53935',  // 红色小人（登山服，任何背景都醒目）
  guide:     '#FF00FF',  // 坡道参考线（调试用，默认关）
};

// ---------- 显示开关 ----------
const show = {
  host: true, mountain: true, rock: true, snow: true,
  crack: true, person: true, ridge: true, guide: false,
};

// ---------- 沿山脊折线插值：给定 x 求坡面高度 y（局部坐标）----------
function groundAt(x) {
  for (let i = 0; i < RIDGE.length - 2; i++) {   // 用前 n-1 点（不含右缘）
    const [x1, y1] = RIDGE[i], [x2, y2] = RIDGE[i+1];
    if (x >= x1 && x <= x2) {
      const t = (x - x1) / (x2 - x1);
      return y1 + (y2 - y1) * t;
    }
  }
  return 80;
}

// ---------- 画"宿主区"（步骤 B：宿主画满整屏背景，动画透明区透出它）----------
// 宿主项目真实场景：背景铺满全屏（含动画区下方），动画只在上方叠加山+人
function drawHostArea() {
  if (!show.host) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 240, 240); return; }

  // 0) 宿主背景铺满整屏（含动画区 y160~240 的底色，供透明区透出）
  ctx.fillStyle = '#23272F'; ctx.fillRect(0, 0, 240, 240);
  //    动画区下方再铺一层浅色衬底（更明显看出"透出宿主背景"而非黑色）
  ctx.fillStyle = '#2E3442'; ctx.fillRect(0, ANIM_Y, 240, ANIM_H);

  // 1) 顶部标题栏
  ctx.fillStyle = '#4DA3FF'; ctx.fillRect(0, 0, 240, 22);
  ctx.fillStyle = '#0B1A2B'; ctx.font = 'bold 13px sans-serif';
  ctx.fillText('MY APP UI', 10, 16);

  // 2) 三个"卡片"占位（宿主 UI 内容）
  const cards = [['#E53935','TEMP 26°'], ['#3CBE6D','HR 72'], ['#F5B83B','STEP 0']];
  cards.forEach(([c, t], i) => {
    ctx.fillStyle = c; ctx.fillRect(14 + i * 76, 34, 66, 32);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px sans-serif';
    ctx.fillText(t, 18 + i * 76, 53);
  });

  // 3) 文字说明区（上方）
  ctx.fillStyle = '#9AA7BD'; ctx.font = '11px sans-serif';
  ctx.fillText('← 宿主区（上方 2/3）', 14, 104);
  ctx.fillText('   每帧由宿主绘制，动画不触碰', 14, 120);
  ctx.fillText('   下方 y=160 为动画区边界', 14, 136);

  // 4) 分界线（y=160）
  ctx.fillStyle = '#6B7485'; ctx.fillRect(0, ANIM_Y - 0.5, 240, 1);

  // 5) 动画区下方的宿主背景标注（说明透明区透出的是它）
  ctx.fillStyle = '#566078';
  ctx.font = '9px sans-serif';
  ctx.fillText('── 宿主背景（动画透明区透出此层）──', 34, 238);
}

// ---------- 画山景背景（画到离屏 anim，局部坐标）----------
function drawMountain() {
  // 0) 整张动画画布先填透明色（替代原来动画自带的天空）
  actx.fillStyle = TRANSP; actx.fillRect(0, 0, W, ANIM_H);

  // 1) 山体主轮廓（沿折线山脊 → 底部 y=80 闭合）
  if (show.mountain) {
    actx.fillStyle = C.mountain;
    actx.beginPath();
    actx.moveTo(0, 80);
    RIDGE.forEach(([x, y]) => actx.lineTo(x, y));
    actx.closePath();
    actx.fill();
  }

  // 2) 岩层：沿每段山脊往下延展的梯形岩石带（受光面逐层变浅）
  if (show.rock) {
    const drop = [10, 9, 9, 8, 8, 7, 6, 6, 5];
    for (let i = 0; i < RIDGE.length - 2; i++) {
      const [x1, y1] = RIDGE[i], [x2, y2] = RIDGE[i+1];
      const d = drop[i];
      actx.fillStyle = C.rock[Math.min(i, C.rock.length - 1)];
      actx.beginPath();
      actx.moveTo(x1, y1);
      actx.lineTo(x2, y2);
      actx.lineTo(x2, y2 + d);
      actx.lineTo(x1, y1 + d);
      actx.closePath();
      actx.fill();
    }
  }

  // 3) 雪帽（贴合山顶台地：局部 y≈28~44，底缘压 y≈42~44 的台地/坡面，不悬空）
  if (show.snow) {
    actx.fillStyle = C.snow;
    actx.beginPath();
    actx.moveTo(191,  44);   // 左基底（落在左坡局部 y≈44）
    actx.lineTo(197,  33);   // 沿左肩拾级而上
    actx.lineTo(205,  28);   // 左侧隆起
    actx.lineTo(214,  28);   // 顶面（与台地同宽）
    actx.lineTo(221,  36);   // 右下落到台地右缘
    actx.lineTo(215,  42);   // 回到台地表面
    actx.lineTo(203,  43);   // 沿台地闭合
    actx.closePath();
    actx.fill();
  }

  // 4) 岩石裂缝：几条从山脊向下的深色短线（局部坐标）
  if (show.crack) {
    actx.strokeStyle = C.crack;
    actx.lineWidth = 1;
    const cracks = [
      [70, 60, 74, 71], [115, 48, 120, 60], [150, 50, 155, 60],
      [178, 24, 182, 35], [196, 10, 200, 22], [95, 54, 99, 64],
    ];
    cracks.forEach(([x1,y1,x2,y2]) => {
      actx.beginPath(); actx.moveTo(x1,y1); actx.lineTo(x2,y2); actx.stroke();
    });
  }

  // 5) 山脊受光棱线（沿整条爬坡山脊描白）
  if (show.ridge) {
    actx.strokeStyle = C.ridge;
    actx.lineWidth = 2;
    actx.beginPath();
    actx.moveTo(0, 80);
    for (let i = 1; i < RIDGE.length - 1; i++) actx.lineTo(RIDGE[i][0], RIDGE[i][1]);
    actx.stroke();
  }

  // 6) 坡道参考线（调试用，默认关）
  if (show.guide) {
    actx.strokeStyle = C.guide; actx.lineWidth = 1;
    actx.beginPath(); actx.moveTo(0, 80);
    for (let i = 1; i < RIDGE.length - 1; i++) actx.lineTo(RIDGE[i][0], RIDGE[i][1]);
    actx.stroke();
  }
}

// ---------- 画小人（画到离屏 anim，局部坐标；侧身 + 前后摆臂）----------
function drawPerson(cx, gyL, gyR, color) {
  const gyMid = Math.floor((gyL + gyR) / 2);
  // 摆臂相位：随移动距离推进（每走 24px 完成一个周期），停止即静止
  const ph = (cx - 20) / 24 * Math.PI * 2;   // 相位角 0~2π
  const s = Math.sin(ph);                    // -1~1，决定前后摆

  actx.strokeStyle = color;
  actx.fillStyle = color;
  actx.lineWidth = 2;
  actx.beginPath(); actx.arc(cx + 5, gyMid - 28, 8, 0, Math.PI*2); actx.fill();                        // 头（略前探）
  actx.beginPath(); actx.moveTo(cx + 5, gyMid - 20); actx.lineTo(cx + 4, gyMid - 18); actx.stroke();    // 脖子（下巴→肩，略斜）
  actx.beginPath(); actx.moveTo(cx + 4, gyMid - 18); actx.lineTo(cx - 2, gyMid - 10); actx.stroke();    // 躯干（前倾：肩→髋）

  // —— 前后摆臂：手绕肩做钟摆式弧线摆动（不是水平平移）——
  const L = 10;                    // 臂长 (px)
  const SWING_A = 0.6;             // 摆动角幅度 (弧度) ≈ ±34°
  const BASE_A = 0.2;              // 自然下垂略前倾 (弧度)
  const sxj = cx + 4, syj = gyMid - 18;          // 肩
  // 前臂角：BASE + SWING*sin；后臂角：-BASE - SWING*sin（反相 180°）
  const aF = BASE_A + SWING_A * s;
  const hfX = sxj + L * Math.sin(aF), hfY = syj + L * Math.cos(aF);     // 前手（弧线位）
  const aB = -BASE_A - SWING_A * s;
  const hbX = sxj + L * Math.sin(aB), hbY = syj + L * Math.cos(aB);     // 后手（弧线位）
  // 肘：肩→手 50% 处（两段式，随弧线跟随）
  const efX = sxj + 0.5 * (hfX - sxj), efY = syj + 0.5 * (hfY - syj);
  const ebX = sxj + 0.5 * (hbX - sxj), ebY = syj + 0.5 * (hbY - syj);

  actx.beginPath(); actx.moveTo(sxj, syj); actx.lineTo(efX, efY); actx.stroke();    // 前臂上段
  actx.beginPath(); actx.moveTo(efX, efY); actx.lineTo(hfX, hfY); actx.stroke();    // 前臂下段→前手
  actx.beginPath(); actx.moveTo(sxj, syj); actx.lineTo(ebX, ebY); actx.stroke();    // 后臂上段
  actx.beginPath(); actx.moveTo(ebX, ebY); actx.lineTo(hbX, hbY); actx.stroke();    // 后臂下段→后手

  // —— 迈腿（阶段2）：双腿相位交替迈步，脚贴合坡面，对角协同 ——
  // 对角协同：左腿相位 = 右臂(+s)，右腿相位 = 左臂(-s) → 迈左腿伸右臂
  const LEG_STEP = 5;                    // 脚前后步幅 (px)
  const hix = cx - 2, hiy = gyMid - 10;  // 髋（躯干下端）
  // 左腿（后腿，相位 +s：s>0 时向前迈）
  const lFootX = cx - 7 + LEG_STEP * s;
  const lFootY = Math.floor(groundAt(lFootX));
  // 右腿（前腿，相位 -s：s>0 时向后收）
  const rFootX = cx + 7 - LEG_STEP * s;
  const rFootY = Math.floor(groundAt(rFootX));
  // 膝：髋→脚中点，微微上抬保持弯曲（两段式）
  const lKneeX = (hix + lFootX) / 2, lKneeY = (hiy + lFootY) / 2 - 2;
  const rKneeX = (hix + rFootX) / 2, rKneeY = (hiy + rFootY) / 2 - 2;

  actx.beginPath(); actx.moveTo(hix, hiy); actx.lineTo(lKneeX, lKneeY); actx.stroke();   // 左腿上段
  actx.beginPath(); actx.moveTo(lKneeX, lKneeY); actx.lineTo(lFootX, lFootY); actx.stroke(); // 左腿下段→脚
  actx.beginPath(); actx.moveTo(hix, hiy); actx.lineTo(rKneeX, rKneeY); actx.stroke();   // 右腿上段
  actx.beginPath(); actx.moveTo(rKneeX, rKneeY); actx.lineTo(rFootX, rFootY); actx.stroke(); // 右腿下段→脚
}

// ---------- 透明色按键推屏（对应 LovyanGFX pushSprite(x, y, transp)）----------
// 离屏动画画布中颜色 == TRANSP(黑) 的像素变为全透明再贴屏 → 该处露出下方宿主内容
function pushWithTransp() {
  const imgData = actx.getImageData(0, 0, W, ANIM_H);
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i] === 0 && d[i+1] === 0 && d[i+2] === 0) {  // 等于 TRANSP(0x0000)
      d[i+3] = 0;   // alpha = 0 → 不覆盖宿主内容
    }
  }
  actx.putImageData(imgData, 0, 0);
  ctx.drawImage(anim, 0, ANIM_Y);
}

// ---------- 渲染一帧 ----------
// 对应 main.cpp 的 drawFrame()：清屏 → 画宿主区 → 画动画到离屏 → 透明按键推屏
function drawFrame(personX) {
  ctx.clearRect(0, 0, W, SCR_H);
  drawHostArea();                          // ① 宿主区（整屏背景 + 上方 UI，动画不碰）
  drawMountain();                          // ② 山体画到离屏 anim
  if (show.person) {
    const gyL = Math.floor(groundAt(personX - 6));
    const gyR = Math.floor(groundAt(personX + 6));
    drawPerson(personX, gyL, gyR, C.person);  // ③ 小人画到离屏 anim
    document.getElementById('roX').textContent = personX;
    document.getElementById('roGL').textContent = gyL;
    document.getElementById('roGR').textContent = gyR;
    document.getElementById('xVal').textContent = personX;
  }
  // ④ 透明按键推屏：TRANSP 像素跳过 → 山体与小人之下的宿主背景可见
  pushWithTransp();
}

// ============================================================
// 动画循环（基于时间，速度滑块控制移动快慢）
// ============================================================
let playing = true;
let currentX = 100;
const slider = document.getElementById('personX');
const speedSlider = document.getElementById('speed');
let lastT = 0;
const msPerPx = s => 120 - (s - 1) * (114 / 99);

function tick(ts) {
  if (!lastT) lastT = ts;
  const dt = ts - lastT;
  lastT = ts;
  if (playing) {
    currentX += dt / msPerPx(parseInt(speedSlider.value, 10));
    if (currentX > 205) currentX = 20;
    slider.value = Math.round(currentX);
    drawFrame(Math.round(currentX));
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
drawFrame(currentX);

// ---------- 控件事件 ----------
document.getElementById('btnPlay').addEventListener('click', e => {
  playing = true;
  e.target.classList.add('active');
  document.getElementById('btnPause').classList.remove('active');
});
document.getElementById('btnPause').addEventListener('click', e => {
  playing = false;
  e.target.classList.add('active');
  document.getElementById('btnPlay').classList.remove('active');
});
slider.addEventListener('input', () => {
  currentX = parseInt(slider.value, 10);
  drawFrame(currentX);
});
speedSlider.addEventListener('input', () => {
  document.getElementById('spdVal').textContent =
    speedSlider.value < 35 ? '慢' : speedSlider.value < 70 ? '中' : '快';
});
const tgMap = {
  tgHost:'host', tgMountain:'mountain', tgRock:'rock', tgSnow:'snow',
  tgCrack:'crack', tgPerson:'person', tgRidge:'ridge',
};
for (const [id, key] of Object.entries(tgMap)) {
  document.getElementById(id).addEventListener('click', e => {
    show[key] = !show[key];
    e.target.classList.toggle('active', show[key]);
    drawFrame(currentX);
  });
}
</script>
</body>
</html>
